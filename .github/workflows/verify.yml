name: Verify public CharterFlow checkout

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Cache gltest artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-${{ runner.os }}-v0.6.0-rc8
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/test_runner_compat.py tests/test_charterflow_core.py --artifacts-dir .pytest-artifacts
      - run: npm test
      - run: npm run test:frontend-reads
      - run: npm run test:frontend-writes
      - run: npm run test:wallet-steward
      - run: npm run test:create-round-flow
      - run: npm run build:frontend
